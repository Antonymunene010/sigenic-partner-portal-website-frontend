<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E10" />
    <title>Sigenic · Partner Portal</title>
    <meta name="description" content="Sigenic partner portal — support, success stories, knowledge base, and a self-service ROI calculator under the Sigenic Care program." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Flash-free theme init. Stored value is JSON (e.g. "dark"); default is "system".
      // Mirrors src/lib/theme.tsx (MEDIA query + default) — keep the two in sync.
      (function () {
        try {
          var raw = localStorage.getItem('pp.theme');
          var pref = raw ? JSON.parse(raw) : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
